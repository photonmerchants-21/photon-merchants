<!DOCTYPE html>
<html lang="en-KE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search · Photon Merchants</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body data-root=".">
  <div id="chrome-header"></div>
  <main class="wrap" id="main"></main>
  <div id="chrome-footer"></div>
  <script src="js/store.js"></script>
  <script>
    Photon.chrome("home");
    const q = (new URLSearchParams(location.search).get("q") || "").trim().toLowerCase();
    const items = Photon.PRODUCTS.filter(p =>
      [p.name, p.catLabel, p.blurb].join(" ").toLowerCase().includes(q)
    );
    document.getElementById("main").innerHTML = `
      <h1 class="page-title">${q ? "Results for “" + q + "”" : "Search"}</h1>
      <p style="color:var(--muted);margin:0 0 22px">${items.length} ${items.length === 1 ? "piece" : "pieces"}</p>
      <div class="grid">${items.map(Photon.card).join("") || '<div class="empty">Nothing by that name. Try linen, kettle, or fan.</div>'}</div>`;
  </script>
</body>
</html>
