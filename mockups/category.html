<!DOCTYPE html>
<html lang="en-KE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop · Photon Merchants</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body data-root=".">
  <div id="chrome-header"></div>
  <main class="wrap" id="main"></main>
  <div id="chrome-footer"></div>
  <script src="js/store.js"></script>
  <script>
    const labels = { beddings: "Beddings", kitchenware: "Kitchenware", electronics: "Electronics" };
    const c = new URLSearchParams(location.search).get("c") || "beddings";
    Photon.chrome(c);
    const items = Photon.PRODUCTS.filter(p => p.category === c);
    document.title = labels[c] + " · Photon Merchants";
    document.getElementById("main").innerHTML = `
      <p class="crumb"><a href="index.html">Home</a> / ${labels[c]}</p>
      <h1 class="page-title">${labels[c]}</h1>
      <p style="color:var(--muted);margin:0 0 22px">${items.length} pieces, from the Parklands shop.</p>
      <div class="grid">${items.map(Photon.card).join("")}</div>`;
  </script>
</body>
</html>
