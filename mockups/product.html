<!DOCTYPE html>
<html lang="en-KE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product · Photon Merchants</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body data-root=".">
  <div id="chrome-header"></div>
  <main class="wrap" id="main"></main>
  <div id="chrome-footer"></div>
  <script src="js/store.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id") || "rift-duvet";
    const p = Photon.product(id) || Photon.product("rift-duvet");
    Photon.chrome(p.category);
    document.title = p.name + " · Photon Merchants";
    const sizes = p.sizes || [];
    document.getElementById("main").innerHTML = `
      <p class="crumb"><a href="index.html">Home</a> / <a href="category.html?c=${p.category}">${p.catLabel}</a> / ${p.name}</p>
      <div class="product">
        <div>
          <div class="gallery-main"><img id="main-img" src="${Photon.img(p.gallery[0])}" alt="${p.name}"></div>
          <div class="thumbs">${p.gallery.map((g, i) => `
            <button type="button" class="${i === 0 ? "is-on" : ""}" data-src="${Photon.img(g)}">
              <img src="${Photon.img(g)}" alt="">
            </button>`).join("")}</div>
        </div>
        <div class="product-info">
          <p class="kicker">${p.catLabel}</p>
          <h1>${p.name}</h1>
          <p>${p.compare ? `<span class="was">${Photon.kes(p.compare)}</span>` : ""}<span class="now">${Photon.kes(p.price)}</span></p>
          <p class="stock">${p.stock} in Nairobi · ready this week</p>
          <p>${p.blurb}</p>
          ${sizes.length ? `<p class="kicker" style="margin-top:18px">Size</p>
            <div class="swatches" id="sizes">${sizes.map((s, i) => `<button type="button" class="swatch ${i === sizes.length - 1 ? "is-on" : ""}">${s}</button>`).join("")}</div>` : ""}
          <div class="buy-box">
            <div class="qty">
              <button type="button" id="minus">−</button>
              <span id="qty">1</span>
              <button type="button" id="plus">+</button>
            </div>
            <button class="btn btn-gold btn-block" id="add">Add to bag</button>
            <a class="btn btn-ghost btn-block" href="cart.html" id="buy">Buy now</a>
          </div>
          <div class="specs">
            <details open>
              <summary>Description</summary>
              <p>${p.blurb}</p>
            </details>
            <details>
              <summary>Specifications</summary>
              <p>${p.specs}</p>
            </details>
            <details>
              <summary>Delivery</summary>
              <p>Nairobi areas from KES 250. Collect free from Ring Road, Parklands.</p>
            </details>
          </div>
        </div>
      </div>`;

    let qty = 1;
    let size = sizes[sizes.length - 1] || "";
    const paintQty = () => document.getElementById("qty").textContent = qty;
    document.getElementById("minus").onclick = () => { qty = Math.max(1, qty - 1); paintQty(); };
    document.getElementById("plus").onclick = () => { qty += 1; paintQty(); };
    document.querySelectorAll("#sizes .swatch").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("#sizes .swatch").forEach(b => b.classList.remove("is-on"));
        btn.classList.add("is-on");
        size = btn.textContent;
      };
    });
    document.querySelectorAll(".thumbs button").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".thumbs button").forEach(b => b.classList.remove("is-on"));
        btn.classList.add("is-on");
        document.getElementById("main-img").src = btn.dataset.src;
      };
    });
    const add = () => Photon.addToCart(p.id, size, qty);
    document.getElementById("add").onclick = () => {
      add();
      document.getElementById("add").textContent = "Added to bag";
    };
    document.getElementById("buy").onclick = (e) => { e.preventDefault(); add(); location.href = "cart.html"; };
  </script>
</body>
</html>
